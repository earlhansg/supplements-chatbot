name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      redis:
        # redis-stack-SERVER: RedisJSON + RediSearch without RedisInsight, which
        # CI has no use for. Plain `redis:latest` has neither module and every
        # FT.CREATE in the suite would fail.
        image: redis/redis-stack-server:latest
        ports: ["6379:6379"]
        # redis-stack-server ships no built-in Docker HEALTHCHECK, so the health
        # check has to be supplied here or the job races the container's startup.
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # bge-base-en-v1.5's model.safetensors alone is ~438 MB. HF_HOME must be
      # set before sentence-transformers is first imported AND must match this
      # path, or the cache silently never hits and every run re-downloads it.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-base-en-v1.5-${{ runner.os }}

      # CPU-only torch FIRST, so sentence-transformers finds the requirement
      # already satisfied. Installed the other way round, pip pulls the ~800 MB
      # CUDA wheel as a transitive dependency for a runner with no GPU.
      - name: Install CPU-only torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379
          # Correct HERE AND ONLY HERE. tests/conftest.py refuses port 6379
          # because that is the demo instance in docker-compose.yml, whose
          # keyspace a developer is probably mid-demo with. CI's service
          # container is ephemeral and has no demo data to protect — do not
          # copy this line into a local shell.
          ALLOW_DEV_REDIS: "1"
          HF_HOME: ~/.cache/huggingface
        # No job here may depend on a reachable LLM: tests/test_workflow.py and
        # tests/test_rate_limit.py stub app.workflow.generate_answer. A test
        # that hangs in CI is the first place to look.
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Next.js 16 requires Node >= 20.9.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # The project's own eslint script. `next lint` was REMOVED in Next 16 —
      # do not "fix" this to use it.
      - run: npm run lint

      - run: npx tsc --noEmit
      # Deliberately no `next build`: the dashboard's Server Component reads
      # Redis at request time, so a build step would need a live connection and
      # buys nothing over tsc --noEmit here.
