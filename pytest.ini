[pytest]
testpaths = tests

# --strict-markers turns a typo'd marker into an error instead of a silent
# no-op, which is the only thing that makes the two markers below trustworthy
# as a way to select a subset.
addopts = -q --strict-markers

markers =
    redis: needs a live Redis Stack instance (RedisJSON + RediSearch) on TEST_REDIS_URL
    embeddings: loads the ~440 MB sentence-transformers model, so it is slow on a cold cache
